name: assemble-wav

on:
  push:
    paths:
      - .github/workflows/assemble.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble wav from release chunks
        run: |
          if [ -f full_duplex_test.wav ]; then
            echo "wav already present, skipping"
            exit 0
          fi
          for i in $(seq -w 0 14); do
            curl -sLO "https://github.com/${{ github.repository }}/releases/download/v0.1/part_${i}.bin"
          done
          cat part_*.bin > full_duplex_test.wav
          rm part_*.bin
          file full_duplex_test.wav
          ls -lh full_duplex_test.wav
      - name: Commit wav
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add full_duplex_test.wav
          git commit -m "assemble full_duplex_test.wav from release chunks [skip ci]"
          git push
